let phase='intro',score=0,playerX=85,dropY=-10,dropX=310,last=0,tilt=0,tiltEnabled=false,invulnerable=0,elapsed=0;const keys=new Set();
function reset(){phase='intro';score=0;playerX=85;dropY=-10;dropX=310;elapsed=0;invulnerable=0;status.textContent='Get ready!'}
function start(){reset();phase='playing';status.textContent='Score: 0 / 5';last=performance.now()}
function drawImage(name,x,y,w,h){if(img[name].complete&&img[name].naturalWidth)ctx.drawImage(img[name],x,y,w,h)}
function drawText(t,x,y,size=26,color='#142b39'){ctx.font=`bold ${size}px system-ui`;ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#ffffff';ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y)}
function render(){ctx.clearRect(0,0,640,360);drawImage(phase==='intro'?'sky':'ground',0,0,640,360);
if(phase==='intro'){drawImage('cart',285,80,72,128);drawText('This is the Hydro Cart',320,48,29);drawText('Get the water bottle to the cart',320,260,22);drawText('and avoid the rain!',320,291,22);drawText('Press Start',320,330,18);return}
drawImage('cart',546,125,72,129);drawImage('bottle',playerX-13,210,26,58);drawImage('drop',dropX-18,dropY-18,36,36);drawText('Score: '+score+' / 5',105,35,23);
if(phase==='won'){ctx.fillStyle='#0008';ctx.fillRect(0,0,640,360);drawText('You Win!',320,172,52,'#ffdc50');drawText('Press Start to play again',320,220,22,'#fff')}
}
function update(dt){if(phase!=='playing')return;elapsed+=dt;invulnerable=Math.max(0,invulnerable-dt);let dir=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);if(!dir&&tiltEnabled)dir=Math.abs(tilt)>3?Math.max(-1,Math.min(1,tilt/20)):0;
let speed=score<2?205:score<4?145:105;playerX=Math.max(15,Math.min(625,playerX+dir*speed*dt));dropY+=135*dt;if(dropY>380){dropY=-25;dropX=150+Math.random()*330}
if(invulnerable<=0&&Math.abs(playerX-dropX)<27&&Math.abs(238-dropY)<36){score=Math.max(0,score-1);invulnerable=1.2;dropY=-25;dropX=150+Math.random()*330;sound(splash);status.textContent='Watch out for rain! Score: '+score+' / 5'}
if(playerX>552){score++;playerX=54;invulnerable=.4;sound(chime);status.textContent='Score: '+score+' / 5';if(score>=5){phase='won';status.textContent='You Win!'} }
}
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.querySelector('#start').onclick=start;document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key)){e.preventDefault();keys.add(e.key)}});document.addEventListener('keyup',e=>keys.delete(e.key));
for(const [id,key] of [['left','ArrowLeft'],['right','ArrowRight']]){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(key);b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(key))}
canvas.addEventListener('pointerdown',e=>{if(phase!=='playing')return;const r=canvas.getBoundingClientRect();keys.add((e.clientX-r.left)/r.width<.5?'ArrowLeft':'ArrowRight')});for(const event of ['pointerup','pointercancel','pointerleave'])canvas.addEventListener(event,()=>{keys.delete('ArrowLeft');keys.delete('ArrowRight')});
document.getElementById('tilt').onclick=async()=>{try{if(typeof DeviceOrientationEvent==='undefined'){status.textContent='Tilt not supported; use buttons';return}if(typeof DeviceOrientationEvent.requestPermission==='function'){let p=await DeviceOrientationEvent.requestPermission();if(p!=='granted'){status.textContent='Tilt permission not granted';return}}tiltEnabled=true;status.textContent='Tilt enabled. Start playing!'}catch(e){status.textContent='Tilt unavailable; use buttons'}};
window.addEventListener('deviceorientation',e=>{if(e.gamma!=null)tilt=e.gamma});
</script></body></html>
