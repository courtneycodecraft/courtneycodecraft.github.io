<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poppy</title><style>body{font:16px system-ui;background:#172333;color:white;text-align:center;margin:12px}main{max-width:850px;margin:auto}canvas{width:100%;height:auto;background:white;touch-action:none;border-radius:12px}button{font:inherit;padding:10px 16px;margin:4px;border:0;border-radius:8px;cursor:pointer}a{color:white}#msg{min-height:1.5em}</style></head><body><main><h1>Poppy</h1><p id="instructions"></p><p id="score">Score: 0</p><canvas id="stage" width="640" height="360"></canvas><p id="msg" aria-live="polite"></p><button id="start">Start / Restart</button><button id="tilt">Enable tilt</button><button id="shake" hidden>Shake</button><p>Arrow keys / WASD or drag on the game. Tap characters to interact.</p><a href="../index.html">Back to gallery</a></main><script>
const C={"name": "Poppy", "player": -1, "targets": [0, 1, 2], "goal": 0, "edge": false, "sprites": [{"x": 184.79999999999998, "y": 157.6, "size": 53.6, "imgs": ["995f013a387a5b60b96ac10508f423b1c468fa04fa17bd8fe714a9bc4b3986de.svg", "30db70cc230f377d770a7256a7723753284f3d21cec324d638817efbf7bea50e.svg"], "sounds": ["chime.mp3"]}, {"x": 280.8, "y": 157.6, "size": 60.0, "imgs": ["e06e5e0f5a22ae2d5d2d9c18d2daa46b9bd25d79702f0d40b8a38d2367b21c83.svg", "d78397a090d2db3d92c91298667295986572c75cf24f3719ced42c5901778424.svg"], "sounds": ["chime.mp3"]}, {"x": 507.20000000000005, "y": 166.79999999999998, "size": 56.0, "imgs": ["9d716d30bdd133cee7d26796a60441221512c9c9283f5e93706d37dc33965168.svg", "19e2b987c11c8de9139fb329fce159a793aa708259486c483262820500410579.svg"], "sounds": ["chime.mp3"]}, {"x": 2.3999999999999773, "y": 360, "size": 80, "imgs": ["emoji_u1f416.svg", "emoji_u1f416-01.svg"], "sounds": ["snort.mp3"]}], "bg": "70f7872bcfdb5671b9cddec6abc1273d5883f9a360f9a2b3d3823658e4ad199a.png", "instructions": "Tap each character to hear what they say."}, canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'), msg=document.querySelector('#msg'),scoreEl=document.querySelector('#score');document.querySelector('#instructions').textContent=C.instructions;
const load=src=>{let i=new Image();i.src=src;return i},bg=load(C.bg),images=C.sprites.map(s=>s.imgs.map(load));let S=[],score=0,running=false,keys={},pointer=null,tilt=null,last=0,contact=false,noticeUntil=0;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function sound(i,k=0){let src=C.sprites[i].sounds[k];if(src)new Audio(src).play().catch(()=>{});}function say(t){notice(t,2200);if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(t);speechSynthesis.speak(u);}}function notice(t,ms=2000){msg.textContent=t;noticeUntil=performance.now()+ms;}function updateScore(){scoreEl.textContent='Score: '+score;}function reset(){S=C.sprites.map(s=>({...s,hidden:false,costume:0}));score=C.name==='Ayra'?1:0;running=true;pointer=null;contact=false;updateScore();notice('');if(C.name==='Ayra')sound(1);if(C.name==='Victoria')notice('Lets go to the beach.');}function randomize(s){let p=S[C.player];for(let i=0;i<30;i++){s.x=50+Math.random()*540;s.y=50+Math.random()*260;if(!p||Math.hypot(s.x-p.x,s.y-p.y)>110)break;}}function win(){running=false;notice(C.name==='Bronte'?'Good job! You win!':'You win!',1e9);}function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<(a.size+b.size)*.36;}function tap(x,y){if(!running)return;for(let i=S.length-1;i>=0;i--){let s=S[i];if(s.hidden||Math.hypot(x-s.x,y-s.y)>s.size*.65)continue;if(C.name==='Poppy'&&i<3){s.costume=1;say(['thanks so much','thank u','thank you mate'][i]);score++;updateScore();s.hidden=true;if(score===3)notice('All three characters helped!',4000);}else if(C.name==='Bronte'){if(i===0){say('Hello');s.x=clamp(s.x+50,25,615);}else sound(i);}break;}}
function point(e){let r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*640/r.width,y:(e.clientY-r.top)*360/r.height};}canvas.onpointerdown=e=>{let p=point(e);tap(p.x,p.y);if(C.player>=0){pointer=p;canvas.setPointerCapture(e.pointerId);}};canvas.onpointermove=e=>{if(pointer)pointer=point(e)};canvas.onpointerup=canvas.onpointercancel=()=>pointer=null;window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){e.preventDefault();keys[e.key]=true;}});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>{keys={};pointer=null;});document.querySelector('#start').onclick=reset;document.querySelector('#tilt').onclick=async()=>{try{if(typeof DeviceOrientationEvent==='undefined')throw Error();if(DeviceOrientationEvent.requestPermission&&await DeviceOrientationEvent.requestPermission()!=='granted')throw Error();window.addEventListener('deviceorientation',e=>{if(e.gamma!==null)tilt={x:clamp(e.gamma/25,-1,1),y:clamp(e.beta/25,-1,1)};});notice('Tilt enabled where supported');}catch(e){notice('Tilt unavailable; use touch or keyboard.');}};let shake=document.querySelector('#shake');shake.hidden=C.name!=='Ayra';shake.onclick=()=>{score=0;S[0].x=316.25;S[0].y=255;updateScore();sound(0);};
function tick(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(running&&C.player>=0){let p=S[C.player],dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(pointer){dx=clamp((pointer.x-p.x)/20,-1,1);dy=clamp((pointer.y-p.y)/20,-1,1);}else if(!dx&&!dy&&tilt){dx=tilt.x;dy=tilt.y;}p.x+=dx*150*dt;p.y+=dy*150*dt;let r=p.size*.28;if(C.edge&&(p.x<r||p.x>640-r||p.y<r||p.y>360-r)){running=false;notice('You lose',1e9);if(C.name==='Anneliese'){p.hidden=true;sound(0,1);}}p.x=clamp(p.x,r,640-r);p.y=clamp(p.y,r,360-r);if(running){let touching=false;for(let i of C.targets){let s=S[i];if(hit(p,s)){touching=true;if(C.name==='Ayra'){if(!contact){score++;say('its a jellyfish');}}else{score++;if(C.name==='Sophia')randomize(p);else randomize(s);}updateScore();if(C.goal&&score>=C.goal){win();break;}}}contact=touching;}}if(t>noticeUntil)msg.textContent='';ctx.clearRect(0,0,640,360);if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,640,360);S.forEach((s,i)=>{if(s.hidden)return;let im=images[i][s.costume];if(im.complete&&im.naturalWidth){let k=s.size/Math.max(im.naturalWidth,im.naturalHeight),w=im.naturalWidth*k,h=im.naturalHeight*k;ctx.drawImage(im,s.x-w/2,s.y-h/2,w,h);}});requestAnimationFrame(tick);}S=C.sprites.map(s=>({...s,hidden:false,costume:0}));requestAnimationFrame(tick);
</script></body></html>
