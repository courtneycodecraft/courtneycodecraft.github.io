<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>friend maker</title><style>body{font:16px system-ui;background:#172333;color:white;text-align:center;margin:12px}canvas{width:min(100%,900px);height:auto;background:white;touch-action:none;border-radius:8px}button{font:inherit;padding:12px 20px;margin:4px;border:0;border-radius:8px}#status{min-height:24px}a{color:white}</style></head><body><h2>friend maker</h2><div id="status">Press Start</div><canvas id="stage" width="640" height="360"></canvas><div><button id="start">Start / Restart</button><button id="tilt">Enable tilt</button><button id="skip">Skip intro</button></div><p>Arrow keys or WASD, or touch and hold a point on the game.</p><a href="../index.html">Back to games</a><script>const config={"name": "Mia", "sprites": [{"id": "iEmoji1", "x": 283.83187695261006, "y": 159.72637480773508, "scale": 0.7, "images": ["asset0.svg"], "sounds": ["asset1.mp3", "asset2.wav"]}, {"id": "Woman_standing1", "x": 499.3525423728813, "y": 248.9898305084746, "scale": 1.25, "images": ["asset3.svg", "asset4.svg"], "sounds": ["asset1.mp3"]}], "bg": ["asset5.svg", "asset6.svg"]};</script><script>const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),name=config.name;
const load=src=>{let i=new Image();i.src=src;return i};const backgrounds=config.bg.map(load);const sprites=config.sprites.map(s=>({...s,pics:s.images.map(load)}));const by=id=>sprites.find(s=>s.id===id);const player=by(({Amyra:'Woman_Dancer1',Mia:'iEmoji1',Ivy:'Woman_standing1',Kate:'Cat1'})[name]);let active=false,ready=false,score=0,bg=0,won=false,keys={},pointer=null,tilt=null,run=0,voices=[],cool=0,last=0,notice='',noticeUntil=0;
function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.pitch=1.3;speechSynthesis.speak(u)}}
function audio(s,i){return new Promise(resolve=>{if(!s.sounds[i])return resolve();let a=new Audio(s.sounds[i]);voices.push(a);let done=()=>{voices=voices.filter(v=>v!==a);resolve()};a.onended=done;a.onerror=done;a.play().catch(done);});}
function size(s){let i=s.pics[0];return [Math.max(12,(i.naturalWidth||128)*s.scale),Math.max(12,(i.naturalHeight||128)*s.scale)]}function hit(a,b){let [w,h]=size(a),[v,z]=size(b);return Math.abs(a.px-b.px)<(w+v)*.34&&Math.abs(a.py-b.py)<(h+z)*.34}function random(s){s.px=45+Math.random()*550;s.py=45+Math.random()*270}function message(t){notice=t;noticeUntil=performance.now()+2200}function stopAudio(){voices.forEach(a=>{a.pause();a.onended?.()});voices=[];if('speechSynthesis'in window)speechSynthesis.cancel()}
async function intro(id){let a=by('iEmoji2'),b=player;await Promise.all([(async()=>{for(let i of [3,4,6,7]){if(id!==run||ready)return;await audio(a,i)}})(),(async()=>{for(let i of [4,5]){if(id!==run||ready)return;await audio(b,i)}})()]);if(id===run&&!ready)ready=true}
function start(){run++;stopAudio();active=true;ready=true;won=false;score=0;cool=0;notice='';bg=0;pointer=null;for(let s of sprites){s.px=s.x;s.py=s.y;s.hidden=false;s.flip=false;s.pending=false}if(name==='Kate'){player.px=108.8;player.py=272;by('Droplet1').py=0}if(name==='Mia'){bg=0;say('hi can we be friends')}if(name==='Ivy'){bg=1;by('iEmoji1').hidden=true;ready=false;intro(run)} }
for(let s of sprites){s.px=s.x;s.py=s.y;s.hidden=false}if(name==='Mia')bg=1;if(name==='Ivy'){bg=1;by('iEmoji1').hidden=true}document.querySelector('#start').onclick=start;document.querySelector('#skip').hidden=name!=='Ivy';document.querySelector('#skip').onclick=()=>{if(active){ready=true;stopAudio()}};document.querySelector('#tilt').onclick=async()=>{try{if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')return;window.addEventListener('deviceorientation',e=>{if(e.gamma!==null)tilt=[e.gamma/20,(e.beta-25)/20]});message('Tilt enabled')}catch{message('Tilt unavailable; use touch')}};
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d'].includes(k)){e.preventDefault();keys[k]=true}});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);window.addEventListener('blur',()=>{keys={};pointer=null});function point(e){let r=canvas.getBoundingClientRect();pointer=[(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*360/r.height]}canvas.onpointerdown=e=>{if(!active)start();canvas.setPointerCapture(e.pointerId);point(e)};canvas.onpointermove=e=>{if(pointer)point(e)};canvas.onpointerup=canvas.onpointercancel=()=>pointer=null;
function tick(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(active&&ready&&!won){let dx=+(keys.arrowright||keys.d||false)- +(keys.arrowleft||keys.a||false),dy=+(keys.arrowdown||keys.s||false)- +(keys.arrowup||keys.w||false);if(pointer){dx=(pointer[0]-player.px)/15;dy=(pointer[1]-player.py)/15}else if(!dx&&!dy&&tilt){[dx,dy]=tilt}let norm=Math.max(1,Math.hypot(dx,dy)),speed=name==='Kate'&&score<=2?230:155;player.px=Math.max(15,Math.min(625,player.px+dx/norm*speed*dt));player.py=Math.max(15,Math.min(345,player.py+dy/norm*speed*dt));if(dx)player.flip=dx<0;cool=Math.max(0,cool-dt);
if(name==='Kate'){let drop=by('Droplet1'),pillow=by('iEmoji1');drop.py+=145*dt;drop.px=320+10*drop.py/360;if(drop.py>360)drop.py=0;if(hit(player,drop)&&!cool){score--;cool=1.5;message("Don't touch the raindrop");navigator.vibrate?.(100)}if(hit(player,pillow)){score++;player.px=67.5;player.py=292.5;if(score>=10){won=true;audio(player,0);message('You win')}}}
if(name==='Mia'){let friend=by('Woman_standing1');if(hit(player,friend)&&!cool){score++;cool=.6;random(friend);audio(player,0);say('nice to meet you lets be friends')}}
if(name==='Ivy'){let item=by('iEmoji4');if(hit(player,item)&&!cool){score++;cool=.4;random(item);if(score>=10){won=true;by('iEmoji3').hidden=true;by('iEmoji1').hidden=false;audio(player,6);message('Happy plant!')}}}
if(name==='Amyra'){for(let s of sprites){if(s===player||s.id==='iEmoji5'||s.hidden||s.pending||!hit(player,s))continue;s.pending=true;let id=run;audio(s,['iEmoji2','iEmoji8','iEmoji9'].includes(s.id)?2:1).then(()=>{if(run===id){s.hidden=true;score++}})}}}
ctx.clearRect(0,0,640,360);let b=backgrounds[bg];if(b?.complete&&b.naturalWidth)ctx.drawImage(b,0,0,640,360);for(let s of sprites){if(s.hidden)continue;let i=s.pics[0];if(!i.complete||!i.naturalWidth)continue;let [w,h]=size(s);ctx.save();ctx.translate(s.px,s.py);if(s.flip)ctx.scale(-1,1);ctx.drawImage(i,-w/2,-h/2,w,h);ctx.restore()}status.textContent=!active?'Press Start':!ready?'Listen to the introduction or skip it':won?(name==='Ivy'?'Happy plant!':'You win!'):t<noticeUntil?notice:(name==='Amyra'?'Friends collected: ':'Score: ')+score;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
